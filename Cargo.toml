[package]
name = "docker_maid"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.91"
description = "Policy-driven cleanup for Docker resources left by coding agents"
license = "MIT"
repository = "https://github.com/socrates8300/docker_maid"

[dependencies]
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
fs2 = "0.4"
globset = "0.4"
humantime = "2.3"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"

[dev-dependencies]
os_pipe = "1.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
