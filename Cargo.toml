[package]
name = "docker_maid"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.91"
description = "Policy-driven cleanup for Docker resources left by coding agents"
license = "MIT"
repository = "https://github.com/socrates8300/docker_maid"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
humantime = "2.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
os_pipe = "1.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
